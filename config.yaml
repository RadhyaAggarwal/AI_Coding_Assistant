# Local AI Coding Agent — configuration
#
# All model names, endpoints, and local paths must be read from this file.
# Never hardcode these values in application code.

model:
  # Base URL of the local Ollama server (or any OpenAI/Ollama-compatible
  # inference server). The Model Interface layer talks to this endpoint
  # over HTTP — it does not care where the model process physically runs.
  endpoint_url: "http://localhost:11434"

  # Name of the model to request from the inference server, as registered
  # with `ollama pull <name>` / `ollama list`.
  name: "qwen2.5-coder:7b"

  # Generation request timeout, in seconds. Needs headroom for CPU-only
  # inference — grows with the number of registered tools, since the full
  # tool schema list is sent (and must be processed) on every request.
  request_timeout_seconds: 240

  # The pulled model's actual context window, in tokens (check with
  # `ollama show <name>` if you change models). Used to budget how much
  # conversation history is sent per request — see
  # agent_controller/context_budget.py. 32768 matches qwen2.5-coder:7b.
  context_window_tokens: 32768

  # Sampling temperature passed to Ollama (lower = more deterministic,
  # favoring higher-probability tokens). Left unset, Ollama uses its own
  # default (0.8), which is tuned for general-purpose/creative use, not
  # precise tool-call JSON and code. A low value here doesn't cost any
  # latency (it only changes how a token is sampled from the same
  # already-computed distribution, not how much computation happens) and
  # is expected to reduce exactly the kind of malformed-output and
  # inconsistent-quality issues seen across live testing, since those
  # are more likely at higher temperatures. Live-verified this value is
  # accepted correctly by Ollama before relying on it.
  temperature: 0.2

project:
  # Root directory the agent is allowed to operate on. All tool file
  # access is validated against this path so the agent can't read or
  # write outside of it.
  root_path: "."

execution:
  # Max seconds a run_command tool call may run before being killed.
  command_timeout_seconds: 60

state:
  # Directory, relative to project root, where pre-edit file snapshots and
  # the change log are stored, so any edit_file change can be rolled back
  # (see state/snapshot.py and `python main.py --history` / `--rollback`).
  snapshot_dir: ".agent_state"
